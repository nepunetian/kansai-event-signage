name: Update Kansai Events

on:
  schedule:
    # JST 06:10 = UTC 21:10 (前日)
    - cron: '10 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Collect events
        run: python update_events.py
      - name: Commit updated data
        run: |
          git config user.name "event-signage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet || git commit -m "Update events"
          git push
