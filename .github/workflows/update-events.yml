name: Update Kansai Events

on:
  schedule:
    - cron: '10 21 * * *'   # 日本時間 毎朝6:10
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect events
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python update_events.py

      - name: Commit updated event data
        run: |
          git config user.name "event-signage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.json events-data.js images collection-report.json
          git diff --cached --quiet || git commit -m "Update events"
          git push
