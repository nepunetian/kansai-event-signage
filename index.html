<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>関西イベントサイネージ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <div>
        <div class="eyebrow">KANSAI EVENT SIGNAGE</div>
        <h1>関西のおすすめイベント</h1>
      </div>
      <div class="clockbox">
        <div id="clock">--:--</div>
        <div id="date">----</div>
      </div>
    </header>

    <nav class="filters" aria-label="イベントフィルター">
      <button class="filter active" data-filter="all">すべて</button>
      <button class="filter" data-filter="today">今日</button>
      <button class="filter" data-filter="weekend">今週末</button>
      <button class="filter" data-filter="rail">鉄道</button>
      <button class="filter" data-filter="tech">AI・IT</button>
      <button class="filter" data-filter="tourism">観光</button>
    </nav>

    <main>
      <section class="hero" id="hero">
        <div class="hero-badge">TODAY'S PICK</div>
        <div class="hero-content">
          <div>
            <div class="hero-meta" id="heroMeta">---</div>
            <h2 id="heroTitle">読み込み中...</h2>
            <p id="heroDesc"></p>
            <div class="hero-tags" id="heroTags"></div>
          </div>
          <div class="scorebox">
            <span>おすすめ度</span>
            <strong id="heroScore">--</strong>
          </div>
        </div>
      </section>

      <section>
        <div class="section-head">
          <h3>イベント一覧</h3>
          <div id="count">0件</div>
        </div>
        <div id="grid" class="grid"></div>
      </section>
    </main>

    <footer>
      <span>自動更新: 15分ごと</span>
      <span id="updated">最終更新: --</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
